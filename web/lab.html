<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101512" />
    <meta
      name="description"
      content="Рабочий стол финансового расследования evidable. Изучайте источники, воспроизводите действия агента и проверяйте доказательства рядом с выводами."
    />
    <meta property="og:title" content="evidable · лаборатория расследований" />
    <meta
      property="og:image"
      content="https://sled-genesis.vercel.app/assets/social.png"
    />
    <title>evidable · лаборатория</title>
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="company.css" />
    <link rel="stylesheet" href="material3.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body class="lab">
    <a class="skip-link" href="#main">Перейти к расследованию</a>
    <header class="lab-header">
      <a class="brand" href="./" aria-label="evidable — главная"
        ><img src="assets/mark.svg" width="32" height="32" alt="" /><span
          >evidable</span
        ></a
      ><span class="header-divider"></span
      ><span class="product-name">Лаборатория</span>
      <nav aria-label="Разделы лаборатории">
        <a href="#company" data-nav="company"
          ><span
            class="destination-icon"
            data-icon="bank"
            aria-hidden="true"
          ></span
          >Компания</a
        >
        <a href="#workspace" data-nav="workspace" aria-label="Расследование"
          ><span
            class="destination-icon"
            data-icon="receipt"
            aria-hidden="true"
          ></span
          >Дело</a
        >
        <a href="#verification" data-nav="verification"
          ><span
            class="destination-icon"
            data-icon="shield"
            aria-hidden="true"
          ></span
          >Проверки</a
        >
        <a
          href="#architecture"
          data-nav="architecture"
          aria-label="Устройство среды"
          ><span
            class="destination-icon"
            data-icon="nodes"
            aria-hidden="true"
          ></span
          >Система</a
        >
        <a href="#guide" data-nav="guide" aria-label="Быстрый старт"
          ><span
            class="destination-icon"
            data-icon="book"
            aria-hidden="true"
          ></span
          >Старт</a
        >
      </nav>
      <a
        class="header-github"
        href="https://github.com/amurapan/genesis"
        target="_blank"
        rel="noreferrer"
        aria-label="Исходники на GitHub"
        ><span data-icon="github"></span><span>Исходники</span></a
      ><a class="header-team" href="team.html" aria-label="Команда El Big 4"
        >EL BIG 4</a
      >
    </header>
    <main id="main" tabindex="-1">
      <div id="loading" class="loading-state">
        <span class="loading-spinner"></span>
        <h1>Открываем рабочий стол</h1>
        <p>Загружаем документы и записи расследований.</p>
      </div>
      <div id="app" hidden></div>
    </main>
    <dialog
      id="case-picker"
      class="case-picker"
      aria-labelledby="case-picker-title"
    >
      <div class="case-picker-frame">
        <header class="case-picker-header">
          <h2 id="case-picker-title">Выбрать дело</h2>
          <button
            type="button"
            class="tool-button"
            data-action="close-cases"
            aria-label="Закрыть список дел"
            data-icon="close"
            autofocus
          ></button>
        </header>
        <div id="case-picker-options" class="case-picker-options"></div>
      </div>
    </dialog>
    <div id="toast" role="status" class="toast" hidden></div>
    <noscript
      ><div class="no-script">
        Для просмотра лаборатории нужен JavaScript.
        <a href="https://github.com/amurapan/genesis"
          >Исходники и инструкция запуска</a
        >
      </div></noscript
    >
  </body>
</html>
